---
- name: frontend_service
  systemd:
    name: "{{ frontend_service_name }}"
    daemon-reload: yes
    state: restarted
  become: yes

- name: fronted_update_stopped
  systemd:
    name: "{{ frontend_update_service_name }}"
    enabled: no
    state: stopped
    daemon-reload: yes
  become: yes
  notify: frontend_service

- name: npm_dependencies
  npm:
    path: "{{ frontend_app_path }}"
    executable: "{{ updated_npm_path }} --node-flags --max-old-space-size=512"
  become_user: "{{ frontend_user }}"
  become: yes
  notify: frontend_service
