---
- name: frontend_service
  systemd:
    name: "{{ frontend_service_name }}"
    daemon-reload: yes
    state: restarted
  become: yes

- name: fronted_update_stopped
  systemd:
    name: "{{ frontend_update_service_name }}"
    enabled: no
    state: stopped
    daemon-reload: yes
  become: yes
  notify: frontend_service
