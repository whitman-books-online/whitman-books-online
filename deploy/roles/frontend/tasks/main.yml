---
- name: install packages
  include_tasks: packages.yml

- name: app directory created
  file:
    state: directory
    path: "{{ app_directory }}"
  become: yes

- name: frontend user created
  user:
    name: "{{ frontend_user }}"
    state: present
    home: "{{ frontend_home }}"
    system: yes
  become: yes

- name: app cloned
  git:
    repo: "{{ repo }}"
    dest: "{{ frontend_app_dest }}"
    version: "{{ frontend_version }}"
  become_user: "{{ frontend_user }}"
  become: yes
